<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" rx="16" fill="#0B1422"/>
  <rect x="24" y="20" width="752" height="560" rx="12" fill="#0D1525" stroke="#111C2D" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="58" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Comentarios</text>
  <text x="40" y="78" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">3 comentarios</text>

  <!-- Textarea -->
  <rect x="40" y="100" width="720" height="80" rx="8" fill="#111C2D" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="56" y="128" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.25)">Escribe un comentario...</text>

  <!-- Emoji picker button -->
  <rect x="680" y="122" width="28" height="28" rx="6" fill="#1a2538"/>
  <text x="689" y="142" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">😊</text>

  <!-- Send button -->
  <rect x="716" y="122" width="28" height="28" rx="6" fill="#3b82f6"/>
  <rect x="726" y="131" width="8" height="10" rx="1" fill="white"/>
  <polygon points="728,136 724,139 724,133" fill="#3b82f6"/>

  <!-- Comment 1 -->
  <rect x="40" y="200" width="720" height="80" rx="8" fill="#111C2D"/>
  <circle cx="68" cy="232" r="18" fill="#1a2538"/>
  <text x="68" y="237" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">😊</text>
  <text x="96" y="228" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Ana García</text>
  <text x="96" y="248" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">hace 5 minutos</text>
  <text x="56" y="272" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">¡Este componente funciona en cualquier framework!</text>

  <!-- Reactions on comment 1 -->
  <rect x="664" y="210" width="80" height="24" rx="12" fill="#1a2538"/>
  <text x="672" y="227" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">👍 3 ❤️ 1</text>

  <!-- Comment 2 -->
  <rect x="40" y="296" width="720" height="80" rx="8" fill="#111C2D"/>
  <circle cx="68" cy="328" r="18" fill="#1a2538"/>
  <text x="68" y="333" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🚀</text>
  <text x="96" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Carlos López</text>
  <text x="96" y="344" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">hace 2 horas</text>
  <text x="56" y="368" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">Me encanta que se pueda usar directo en HTML sin React.</text>

  <!-- Reactions on comment 2 -->
  <rect x="664" y="306" width="80" height="24" rx="12" fill="#1a2538"/>
  <text x="672" y="323" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">👍 1 🔥 2</text>

  <!-- Comment 3 -->
  <rect x="40" y="392" width="720" height="80" rx="8" fill="#111C2D"/>
  <circle cx="68" cy="424" r="18" fill="#1a2538"/>
  <text x="68" y="429" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🎉</text>
  <text x="96" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">María Rodríguez</text>
  <text x="96" y="440" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">hace 3 horas</text>
  <text x="56" y="464" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">Probando el tema oscuro y el selector de emojis 🔥</text>

  <!-- Reactions on comment 3 -->
  <rect x="664" y="402" width="80" height="24" rx="12" fill="#1a2538"/>
  <text x="672" y="419" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">❤️ 2 ⭐ 1</text>

  <!-- "Ver más" button -->
  <rect x="340" y="492" width="120" height="36" rx="8" fill="#1a2538" stroke="#111C2D" stroke-width="1"/>
  <text x="400" y="515" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Ver más (3)</text>

  <!-- Grid dots background -->
  <rect width="800" height="600" fill="url(#grid)" opacity="0.03" rx="16"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="white"/>
    </pattern>
  </defs>
</svg>
