<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comment Section — Web Component</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e5e7eb;
        padding: 1.25rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <comment-section></comment-section>

    <script type="module" src="/src/comment-section.js"></script>
    <script type="module">
      import { CommentSection } from '/src/comment-section.js';

      document.addEventListener('DOMContentLoaded', () => {
        const el = document.querySelector('comment-section');

        const demo = [
          { text: '¡Excelente componente! Justo lo que necesitaba para mi proyecto.', name: 'María García', emoji: '🔥' },
          { text: 'Funciona perfecto en React y también en HTML plano. Muy buen trabajo.', name: 'Carlos López', emoji: '❤️' },
          { text: '¿Piensas agregar persistencia con localStorage? Sería útil.', name: 'Ana Martínez', emoji: '👍' },
          { text: 'Me encanta el diseño oscuro. Queda muy profesional.', name: 'Pedro Rodríguez', emoji: '🎉' },
        ];

        const comments = demo.map((c, i) => ({
          id: crypto.randomUUID(),
          ...c,
          date: new Date(Date.now() - i * 3600000).toISOString(),
          avatar: `https://i.pravatar.cc/80?u=demo-${i}`,
        }));

        el.initialComments = comments;
      });
    </script>
  </body>
</html>
